version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - docker-compose.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: .
    image: chatgpt-task:latest
    env_file:
      - docker-compose.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskuser}:${POSTGRES_PASSWORD:-taskpass}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-taskdb}
    ports:
      - "8000:8000"
    command: ["python", "-m", "app.api"]
    depends_on:
      - postgres

  mcp-server:
    build: .
    image: chatgpt-task:latest
    env_file:
      - docker-compose.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskuser}:${POSTGRES_PASSWORD:-taskpass}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-taskdb}
    ports:
      - "8001:8001"
    command: ["python", "-m", "app.mcp_sse"]
    depends_on:
      - postgres

volumes:
  pg_data:
