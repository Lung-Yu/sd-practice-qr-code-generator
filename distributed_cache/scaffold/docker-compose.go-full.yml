version: "3.9"

# Full Go stack — Go router + Go nodes + Go backing store.
# Run with:
#   podman-compose -f docker-compose.yml -f docker-compose.go-full.yml up -d --build

services:
  dc-router:
    build:
      context: ./go_router
      dockerfile: Dockerfile
    image: distributed-cache-go-router:latest
    command: ["./cache-router"]
    environment:
      NODE_URLS: "http://dc-node1:8001,http://dc-node2:8002,http://dc-node3:8003"
      HASH_STRATEGY: "ring"
      VIRTUAL_NODES: "150"
      ROUTER_PORT: "8000"
      STORE_URL: "http://dc-store:8004"
      WRITE_THROUGH_MODE: "${WRITE_THROUGH_MODE:-parallel}"
      LOCAL_CACHE_SIZE: "100"
      LOCAL_CACHE_STRATEGY: "${LOCAL_CACHE_STRATEGY:-counter}"
      LOCAL_CACHE_REBUILD_INTERVAL: "${LOCAL_CACHE_REBUILD_INTERVAL:-10}"

  dc-node1:
    build:
      context: ./go_node
      dockerfile: Dockerfile
    image: distributed-cache-go:latest
    command: ["./cache-node"]
    environment:
      NODE_ID: node1
      NODE_PORT: "8001"
      CAPACITY: "100"

  dc-node2:
    build:
      context: ./go_node
      dockerfile: Dockerfile
    image: distributed-cache-go:latest
    command: ["./cache-node"]
    environment:
      NODE_ID: node2
      NODE_PORT: "8002"
      CAPACITY: "100"

  dc-node3:
    build:
      context: ./go_node
      dockerfile: Dockerfile
    image: distributed-cache-go:latest
    command: ["./cache-node"]
    environment:
      NODE_ID: node3
      NODE_PORT: "8003"
      CAPACITY: "100"

  dc-store:
    build:
      context: ./go_store
      dockerfile: Dockerfile
    image: distributed-cache-go-store:latest
    command: ["./cache-store"]
    environment:
      STORE_PORT: "8004"
    ports:
      - "8004:8004"
